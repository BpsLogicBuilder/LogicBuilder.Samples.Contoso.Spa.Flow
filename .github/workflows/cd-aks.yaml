on: [workflow_dispatch]
name: Deploy to AKS

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"
  PROJECT_NAME: "LogicBuilder.Samples.Contoso.Spa.Flow"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/bpsLogicBuilder/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}

      - name: Install SonarQube Cloud scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: "${{ format('BpsLogicBuilder_{0}', env.PROJECT_NAME) }}"
          SONAR_ORGANIZATION_KEY: "bpslogicbuilder"
        run: |
          dotnet-sonarscanner begin /k:"${{ env.SONAR_PROJECT_KEY }}" /o:"${{ env.SONAR_ORGANIZATION_KEY }}" /d:sonar.qualitygate.wait=true /d:sonar.token="${{ env.SONAR_TOKEN }}" /d:sonar.cs.opencover.reportsPaths="**/TestResults/coverage.opencover.xml"

      - name: Run unit tests
        run: dotnet test Contoso.Spa.Flow.Tests/Contoso.Spa.Flow.Tests.csproj --verbosity normal --configuration Release /p:CollectCoverage=true /p:Threshold=50 /p:ThresholdType=line /p:ThresholdStat=Average /p:CoverletOutput=./TestResults/ /p:ExcludeByAttribute="GeneratedCodeAttribute" /p:CoverletOutputFormat=opencover /p:Exclude="[Contoso.Domain]*%2c[Contoso.Spa.Api]**%2c[Contoso.Data]*"

      - name: End SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="${{ env.SONAR_TOKEN }}"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  deploy-to-aks:
    name: Deploy Workfow App
    runs-on: ubuntu-latest
    if: github.repository_owner == 'BpsLogicBuilder'
    permissions:
      id-token: write
      contents: read
    needs: test
    steps:

    - name: Checkout repository
      uses: actions/checkout@v6

    - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
      with:
        client-id: ${{ secrets.ARM_DEPLOYER_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Get Deployment Outputs
      id: get_deployment_outputs
      env:
        RESOURCE_GROUP: ${{ secrets.AZURE_RG_CONTOSO_AKS }}
      run: |
          ACR_NAME=$(az deployment group show --resource-group ${{ env.RESOURCE_GROUP }} --name main --query properties.outputs.acrName.value -o tsv)
          echo "::add-mask::$ACR_NAME"

          APP_CONFIG_ENDPOINT=$(az deployment group show --resource-group ${{ env.RESOURCE_GROUP }} --name main --query properties.outputs.appConfigurationEndPoint.value -o tsv)
          echo "::add-mask::$APP_CONFIG_ENDPOINT"

          AKS_CLUSTER_NAME=$(az deployment group show --resource-group ${{ env.RESOURCE_GROUP }} --name main --query properties.outputs.aksClusterName.value -o tsv)
          echo "::add-mask::$AKS_CLUSTER_NAME"

          CONTOSO_APP_NAMESPACE=$(az deployment group show --resource-group ${{ env.RESOURCE_GROUP }} --name main --query properties.outputs.kubernetesNamespace.value -o tsv)
          echo "::add-mask::$CONTOSO_APP_NAMESPACE"

          CONTOSO_SPA_API_SERVICEACCOUNT_NAME=$(az deployment group show --resource-group ${{ env.RESOURCE_GROUP }} --name main --query properties.outputs.contosoSpaApiServiceAccountName.value -o tsv)
          echo "::add-mask::$CONTOSO_SPA_API_SERVICEACCOUNT_NAME"

          echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "app_config_endpoint=$APP_CONFIG_ENDPOINT" >> $GITHUB_OUTPUT
          echo "aks_cluster_name=$AKS_CLUSTER_NAME" >> $GITHUB_OUTPUT
          echo "contoso_app_namespace=$CONTOSO_APP_NAMESPACE" >> $GITHUB_OUTPUT
          echo "contoso_spa_api_serviceaccount_name=$CONTOSO_SPA_API_SERVICEACCOUNT_NAME" >> $GITHUB_OUTPUT

    - name: Build and Upload Image
      env:
        IMAGE_TAG: "v1.0.${{ github.run_number }}"
        IMAGE_NAME: "contosospaapi"
        ACR_NAME: ${{ steps.get_deployment_outputs.outputs.acr_name }}
      run: |
        echo "ACR NAME ${{ env.ACR_NAME }}"
        az acr build --registry ${{ env.ACR_NAME }} --image ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} --image ${{ env.IMAGE_NAME }}:latest --file ./Contoso.Spa.Api/Dockerfile .

    - name: Get AKS Credentials
      env:
        RESOURCE_GROUP: ${{ secrets.AZURE_RG_CONTOSO_AKS }}
        AKS_CLUSTER_NAME: ${{ steps.get_deployment_outputs.outputs.aks_cluster_name }}
      run: |
        az aks get-credentials --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.AKS_CLUSTER_NAME }}

    - name: Deploy Manifext
      env:
        ACR_NAME: ${{ steps.get_deployment_outputs.outputs.acr_name }}
        APP_CONFIG_ENDPOINT: ${{ steps.get_deployment_outputs.outputs.app_config_endpoint }}
        IMAGE_TAG: "v1.0.${{ github.run_number }}"
        CONTOSO_APP_NAMESPACE: ${{ steps.get_deployment_outputs.outputs.contoso_app_namespace }}
        CONTOSO_SPA_API_SERVICEACCOUNT_NAME: ${{ steps.get_deployment_outputs.contoso_spa_api_serviceaccount_name }}
      run: |
        sed -e "s|ACR_NAME|${{ env.ACR_NAME }}|g" \
        -e "s|APP_CONFIG_ENDPOINT|${{ env.APP_CONFIG_ENDPOINT }}|g" \
        -e "s|IMAGE_TAG|${{ env.IMAGE_TAG }}|g" \
        -e "s|CONTOSO_APP_NAMESPACE|${{ env.CONTOSO_APP_NAMESPACE }}|g" \
        -e "s|CONTOSO_SPA_API_SERVICEACCOUNT_NAME|${{ env.CONTOSO_SPA_API_SERVICEACCOUNT_NAME }}|g" \
        infrastructure/aks/deployment.yaml | kubectl apply -f - -n ${{ env.CONTOSO_APP_NAMESPACE }}